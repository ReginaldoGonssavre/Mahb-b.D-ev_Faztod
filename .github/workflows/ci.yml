# .github/workflows/ci.yml
# Workflow de Integração Contínua (CI) para a plataforma MAHBUB.dev

name: CI - Build, Test, Lint

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  lint-and-test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Install frontend dependencies
        run: npm install
        working-directory: apps/web

      - name: Run frontend lint
        run: npm run lint
        working-directory: apps/web

      - name: Run frontend tests
        run: npm test
        working-directory: apps/web

  lint-and-test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install backend dependencies
        run: pip install -r requirements.txt # Assumindo um requirements.txt na raiz ou em services/api-gateway
        working-directory: services/api-gateway # Ajuste conforme a localização do seu backend principal

      - name: Run backend lint (e.g., ruff, flake8)
        run: ruff check .
        working-directory: services/api-gateway

      - name: Run backend tests
        run: pytest
        working-directory: services/api-gateway

  # Adicione mais jobs para outros serviços ou pacotes compartilhados
